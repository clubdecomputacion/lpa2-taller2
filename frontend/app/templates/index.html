<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Facturas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Generador de Facturas PDF</h1>
        <form id="form-factura" method="POST" action="{{ url_for('generar_pdf') }}">
            <div class="form-group">
                <label for="id_factura">ID de Factura:</label>
                <input type="text" id="id_factura" name="id_factura"
                       placeholder="Ej: FAC-2025-001" pattern="[A-Za-z0-9_\-]+"
                       title="Solo letras, números, guiones y guion bajo" required>
            </div>
            <div class="acciones">
                <button type="submit" formtarget="_blank">Ver PDF</button>
                <button type="submit" name="descargar" value="1" class="secundario">Descargar PDF</button>
            </div>
        </form>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
